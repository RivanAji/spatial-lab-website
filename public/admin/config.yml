# Decap CMS configuration (PRD section 10 / 5).
#
# TODO before this works: replace `repo` below with the real
# "owner/repo-name" once the repository exists on GitHub, and complete
# the OAuth setup in docs/cms-setup.md (the one step that needs a real
# GitHub account — it can't be done by an agent working from a local
# clone).
backend:
  name: github
  repo: REPLACE_WITH_OWNER/REPLACE_WITH_REPO_NAME
  branch: main
  base_url: https://spatial-lab-oauth.example.workers.dev
  auth_endpoint: auth

# Editors only ever see the rendered form UI below — this file itself,
# and the raw Markdown/YAML it produces, is not something either of the
# two editors (PRD 10.3) need to look at.
site_url: https://REPLACE_WITH_OWNER.github.io/REPLACE_WITH_REPO_NAME
display_url: https://REPLACE_WITH_OWNER.github.io/REPLACE_WITH_REPO_NAME
logo_url: /favicon.ico

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# No draft/approval workflow (PRD 10.3) — two editors, every save
# publishes directly via a commit to main.
publish_mode: simple

collections:
  - name: "teams"
    label: "Research Teams"
    files:
      - name: "team-01"
        label: "01 — Sustainable Urban Transportation"
        file: "content/teams/sustainable-urban-transportation.md"
        fields:
          - { name: "number", label: "Number", widget: "number", value_type: "int", min: 1, max: 3 }
          - { name: "name", label: "Full name (team page)", widget: "string" }
          - { name: "displayName", label: "Short name (homepage)", widget: "string" }
          - { name: "tagline", label: "Tagline", widget: "text" }
          - { name: "focus", label: "Focus keywords", widget: "list" }
          - { name: "coordinatorSlug", label: "Coordinator", widget: "relation", collection: "people", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}" }
          - { name: "memberSlugs", label: "Members", widget: "relation", collection: "people", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}", multiple: true }
          - { name: "body", label: "Overview", widget: "markdown", required: false }
      - name: "team-02"
        label: "02 — Spatial Data Science & AI"
        file: "content/teams/spatial-data-science-ai.md"
        fields:
          - { name: "number", label: "Number", widget: "number", value_type: "int", min: 1, max: 3 }
          - { name: "name", label: "Full name (team page)", widget: "string" }
          - { name: "displayName", label: "Short name (homepage)", widget: "string" }
          - { name: "tagline", label: "Tagline", widget: "text" }
          - { name: "focus", label: "Focus keywords", widget: "list" }
          - { name: "coordinatorSlug", label: "Coordinator", widget: "relation", collection: "people", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}" }
          - { name: "memberSlugs", label: "Members", widget: "relation", collection: "people", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}", multiple: true }
          - { name: "body", label: "Overview", widget: "markdown", required: false }
      - name: "team-03"
        label: "03 — Decision Support & Climate"
        file: "content/teams/decision-support-climate.md"
        fields:
          - { name: "number", label: "Number", widget: "number", value_type: "int", min: 1, max: 3 }
          - { name: "name", label: "Full name (team page)", widget: "string" }
          - { name: "displayName", label: "Short name (homepage)", widget: "string" }
          - { name: "tagline", label: "Tagline", widget: "text" }
          - { name: "focus", label: "Focus keywords", widget: "list" }
          - { name: "coordinatorSlug", label: "Coordinator", widget: "relation", collection: "people", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}" }
          - { name: "memberSlugs", label: "Members", widget: "relation", collection: "people", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}", multiple: true }
          - { name: "body", label: "Overview", widget: "markdown", required: false }

  - name: "people"
    label: "People"
    folder: "content/people"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    fields:
      - { name: "name", label: "Full name (with titles)", widget: "string" }
      - { name: "role", label: "Role", widget: "string", default: "Lecturer" }
      - { name: "photo", label: "Photo", widget: "image", required: false, hint: "Leave empty to show an initials block instead." }
      - { name: "expertise", label: "Expertise keywords", widget: "list" }
      - name: "teams"
        label: "Teams"
        widget: "select"
        multiple: true
        options:
          - { label: "01 Sustainable Urban Transportation", value: "sustainable-urban-transportation" }
          - { label: "02 Spatial Data Science & AI", value: "spatial-data-science-ai" }
          - { label: "03 Decision Support & Climate", value: "decision-support-climate" }
      - name: "coordinatorOf"
        label: "Coordinator of"
        widget: "select"
        required: false
        options:
          - { label: "01 Sustainable Urban Transportation", value: "sustainable-urban-transportation" }
          - { label: "02 Spatial Data Science & AI", value: "spatial-data-science-ai" }
          - { label: "03 Decision Support & Climate", value: "decision-support-climate" }
      - { name: "scholarId", label: "Google Scholar ID", widget: "string", required: false }
      - { name: "orcid", label: "ORCID", widget: "string", required: false }
      - { name: "sintaUrl", label: "SINTA profile URL", widget: "string", required: false }
      - { name: "email", label: "Email", widget: "string", required: false }
      - { name: "bio", label: "Bio", widget: "markdown", required: false }

  - name: "projects"
    label: "Research Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "year", label: "Year", widget: "number", value_type: "int" }
      - name: "team"
        label: "Team"
        widget: "select"
        options:
          - { label: "01 Sustainable Urban Transportation", value: "sustainable-urban-transportation" }
          - { label: "02 Spatial Data Science & AI", value: "spatial-data-science-ai" }
          - { label: "03 Decision Support & Climate", value: "decision-support-climate" }
      - name: "alsoTeams"
        label: "Also relevant to"
        widget: "select"
        multiple: true
        required: false
        options:
          - { label: "01 Sustainable Urban Transportation", value: "sustainable-urban-transportation" }
          - { label: "02 Spatial Data Science & AI", value: "spatial-data-science-ai" }
          - { label: "03 Decision Support & Climate", value: "decision-support-climate" }
      - name: "status"
        label: "Status"
        widget: "select"
        options: ["Active", "Completed", "Ongoing"]
        default: "Active"
      - { name: "shortDescription", label: "Short description", widget: "text" }
      - { name: "coverImage", label: "Cover image", widget: "image", hint: "Real project photo, GIS output, or diagram only — never stock photography (PRD 6.6)." }
      - { name: "gallery", label: "Gallery", widget: "list", field: { label: "Image", name: "image", widget: "image" }, required: false }
      - { name: "location", label: "Location", widget: "string", required: false }
      - { name: "studyArea", label: "Study area", widget: "string", required: false }
      - { name: "members", label: "Members", widget: "relation", collection: "people", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}", multiple: true }
      - { name: "publications", label: "Related publications", widget: "relation", collection: "publications", search_fields: ["title"], display_fields: ["title"], value_field: "{{slug}}", multiple: true, required: false }
      - { name: "products", label: "Related products", widget: "relation", collection: "products", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}", multiple: true, required: false }
      - { name: "doi", label: "DOI", widget: "string", required: false }
      - { name: "externalLink", label: "External link", widget: "string", required: false }
      - { name: "partner", label: "Partner", widget: "string", required: false }
      - { name: "funding", label: "Funding", widget: "string", required: false }
      - { name: "methods", label: "Research methods", widget: "list", required: false }
      - { name: "software", label: "Software", widget: "list", required: false }
      - { name: "dataset", label: "Dataset", widget: "string", required: false }
      - { name: "tags", label: "Tags", widget: "list", required: false }
      - { name: "body", label: "Description", widget: "markdown", required: false }

  - name: "publications"
    label: "Publications"
    folder: "content/publications"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "authors", label: "Authors (as cited)", widget: "string" }
      - { name: "year", label: "Year", widget: "number", value_type: "int" }
      - { name: "venue", label: "Venue", widget: "string", required: false }
      - name: "team"
        label: "Team"
        widget: "select"
        options:
          - { label: "01 Sustainable Urban Transportation", value: "sustainable-urban-transportation" }
          - { label: "02 Spatial Data Science & AI", value: "spatial-data-science-ai" }
          - { label: "03 Decision Support & Climate", value: "decision-support-climate" }
      - name: "alsoTeams"
        label: "Also relevant to"
        widget: "select"
        multiple: true
        required: false
        options:
          - { label: "01 Sustainable Urban Transportation", value: "sustainable-urban-transportation" }
          - { label: "02 Spatial Data Science & AI", value: "spatial-data-science-ai" }
          - { label: "03 Decision Support & Climate", value: "decision-support-climate" }
      - { name: "doi", label: "DOI", widget: "string", required: false }
      - { name: "url", label: "Link", widget: "string", required: false }
      - { name: "citations", label: "Citation count", widget: "number", value_type: "int", required: false, hint: "Real count only — update from Scholar, never estimate." }
      - { name: "abstract", label: "Abstract", widget: "text", required: false }
      - { name: "members", label: "Lab members among the authors", widget: "relation", collection: "people", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}", multiple: true, required: false }

  - name: "products"
    label: "Research Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    fields:
      - { name: "name", label: "Name", widget: "string" }
      - name: "type"
        label: "Type"
        widget: "select"
        options: ["Software", "WebGIS", "Dataset", "Model", "Tool"]
      - { name: "shortDescription", label: "Short description", widget: "text" }
      - { name: "coverImage", label: "Cover image", widget: "image" }
      - { name: "gallery", label: "Gallery", widget: "list", field: { label: "Image", name: "image", widget: "image" }, required: false }
      - name: "team"
        label: "Team"
        widget: "select"
        options:
          - { label: "01 Sustainable Urban Transportation", value: "sustainable-urban-transportation" }
          - { label: "02 Spatial Data Science & AI", value: "spatial-data-science-ai" }
          - { label: "03 Decision Support & Climate", value: "decision-support-climate" }
      - { name: "owners", label: "Owners", widget: "relation", collection: "people", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}", multiple: true }
      - { name: "accessLink", label: "Access / download link", widget: "string", required: false }
      - { name: "citation", label: "How to cite", widget: "text", required: false }
      - { name: "relatedPublications", label: "Related publications", widget: "relation", collection: "publications", search_fields: ["title"], display_fields: ["title"], value_field: "{{slug}}", multiple: true, required: false }
      - { name: "body", label: "Description", widget: "markdown", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About page"
        file: "content/pages/about.md"
        fields:
          - { name: "mission", label: "Mission / vision", widget: "text" }
          - { name: "history", label: "Short history", widget: "text" }
          - { name: "contact", label: "Contact / how to join", widget: "text" }
          - { name: "body", label: "Body", widget: "markdown", required: false }

  - name: "settings"
    label: "Site settings"
    files:
      - name: "site"
        label: "Site"
        file: "content/settings/site.yml"
        fields:
          - { name: "instagramUrl", label: "Instagram URL", widget: "string", required: false, hint: "Leave empty to hide — a dead link is worse than no link (PRD 11)." }
          - { name: "linkedinUrl", label: "LinkedIn URL", widget: "string", required: false }
          - { name: "youtubeUrl", label: "YouTube URL", widget: "string", required: false }
